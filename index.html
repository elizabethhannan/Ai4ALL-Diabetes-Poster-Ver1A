<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicting Mild Cognitive Impairment in Older Adults with Type 2 Diabetes</title>
    <meta name="description" content="AI4ALL Ignite 2026 · Group 6C · GE-79 MCI Prediction using Machine Learning">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@5/github-markdown-light.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
        
        /* Teal color scheme from AI4ALL Design System */
        .markdown-body {
            background-color: #ffffff;
            color: #2d5959;
        }
        
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 {
            color: #1a5f5f;
            border-bottom: 1px solid #e8f5f2;
            padding-bottom: 0.3em;
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        
        .markdown-body h1 {
            color: #003d3d;
            font-size: 2em;
            border-bottom: 2px solid #52b8a8;
        }
        
        .markdown-body h2 {
            color: #1a5f5f;
            font-size: 1.5em;
        }
        
        .markdown-body h3 {
            color: #2d7a7a;
            font-size: 1.25em;
        }
        
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        
        .markdown-body table tr:nth-child(odd) {
            background-color: #e8f5f2;
        }
        
        .markdown-body table th {
            background-color: #2d5959;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 700;
        }
        
        .markdown-body table td {
            padding: 12px;
            border: 1px solid #c8e6e1;
        }
        
        .markdown-body a {
            color: #52b8a8;
            text-decoration: none;
        }
        
        .markdown-body a:hover {
            text-decoration: underline;
        }
        
        .markdown-body code {
            background-color: #e8f5f2;
            color: #1a5f5f;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        
        .markdown-body pre {
            background-color: #2d5959;
            color: #ffffff;
            padding: 16px;
            border-radius: 6px;
            overflow: auto;
            line-height: 1.45;
            margin: 16px 0;
        }
        
        .markdown-body pre code {
            background-color: transparent;
            color: #ffffff;
            padding: 0;
            border-radius: 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #52b8a8;
            font-size: 18px;
        }
        
        .error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="markdown-body" id="content">
        <div class="loading">
            📄 Loading README.md...
        </div>
    </div>

    <script>
        // Fetch and display README.md
        const markdownUrl = './README.md';
        
        fetch(markdownUrl)
            .then(response => {
                if (!response.ok) throw new Error('README.md not found');
                return response.text();
            })
            .then(markdown => {
                // Use showdown.js to convert markdown to HTML
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js';
                script.onload = () => {
                    const converter = new showdown.Converter({
                        tables: true,
                        strikethrough: true,
                        tasklists: true,
                        ghCodeBlocks: true
                    });
                    const html = converter.makeHtml(markdown);
                    document.getElementById('content').innerHTML = html;
                    
                    // Enhance links to open in new tab (except same-domain)
                    document.querySelectorAll('a').forEach(link => {
                        if (!link.href.includes(window.location.hostname)) {
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                        }
                    });
                };
                document.head.appendChild(script);
            })
            .catch(error => {
                console.error('Error loading README:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>⚠️ Error Loading README.md</h3>
                        <p>The README.md file could not be loaded. Please check that:</p>
                        <ul>
                            <li>The README.md file exists in the repository root</li>
                            <li>GitHub Pages is enabled (Settings → Pages)</li>
                            <li>The repository is public or you have access</li>
                        </ul>
                        <p><a href="https://github.com/elizabethhannan/Ai4ALL-Diabetes-Poster-Ver1A">View on GitHub</a></p>
                    </div>
                `;
            });
    </script>
</body>
</html>
